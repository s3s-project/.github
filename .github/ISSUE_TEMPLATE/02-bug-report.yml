name: Bug Report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Pull requests are welcome - if you would like to fix this yourself, say so below and we will point you at the right place to start.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior. Code snippets are welcome.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and any other relevant environment details.
    validations:
      required: false
  - type: dropdown
    id: pr_intent
    attributes:
      label: Pull request intent
      description: Optional, and there is no expectation either way. "With guidance" just means we point you at the code and the gates.
      options:
        - "Yes - I plan to open a pull request"
        - "Maybe - I would need some guidance"
        - "No - just reporting the issue"
    validations:
      required: false

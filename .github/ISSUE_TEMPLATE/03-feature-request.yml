name: Feature Request
description: Suggest an idea for this project
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!

        Pull requests are welcome - if you would like to implement this, say so below and we will point you at the right place to start.
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why do you need this feature? What problem does it solve?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: dropdown
    id: pr_intent
    attributes:
      label: Pull request intent
      description: Optional, and there is no expectation either way. "With guidance" just means we point you at the code and the gates.
      options:
        - "Yes, I plan to open one"
        - "Maybe, with some guidance"
        - "No, just suggesting"
    validations:
      required: false
